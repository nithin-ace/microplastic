<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Pipeline</title>

<link href="../static/css/bootstrap.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body{
    background:linear-gradient(135deg,#eef2ff,#e0e7ff);
    font-family:"Segoe UI",sans-serif;
}

/* ===== SIDEBAR ===== */
.sidebar{
    position:fixed;
    width:260px;
    height:100%;
    background:linear-gradient(180deg,#020617,#1e3a8a,#1d4ed8);
    padding:20px;
    box-shadow:6px 0 30px rgba(0,0,0,.2);
}

.sidebar .logo{
    text-align:center;
    color:#fff;
    font-weight:700;
    font-size:20px;
    margin-bottom:30px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    margin-bottom:12px;
    color:#c7d2fe;
    border-radius:12px;
    text-decoration:none;
    transition:.3s;
}

.sidebar a i{
    width:35px;
    height:35px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
}

.sidebar a:hover{
    background:rgba(255,255,255,0.1);
    color:#fff;
    transform:translateX(6px);
}

.sidebar a.active{
    background:linear-gradient(90deg,#2563eb,#3b82f6);
    color:#fff;
}

/* ===== MAIN ===== */
.main{
    margin-left:260px;
    padding:25px 40px;
}

/* ===== NAVBAR ===== */
.navbar-custom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(90deg,#1e3a8a,#2563eb);
    padding:15px 25px;
    border-radius:18px;
    color:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.nav-icons{
    display:flex;
    gap:15px;
}

.nav-icons a{
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    transition:.3s;
}

.nav-icons a:hover{
    background:#fff;
    color:#1d4ed8;
    transform:scale(1.1);
}

/* ===== STEP HEADER ===== */
.step-card{
    margin-top:25px;
    background:#fff;
    padding:20px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    text-align:center;
    border-left:6px solid #2563eb;
}

.step-card h4{
    margin:0;
    font-weight:600;
    color:#1e3a8a;
}

/* ===== IMAGE GRID ===== */
.grid{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:25px;
}

/* IMAGE CARD */
.img-box{
    background:#fff;
    padding:10px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    transition:.3s;
    border:2px solid transparent;
}

.img-box:hover{
    transform:translateY(-6px);
    border:2px solid #2563eb;
    box-shadow:0 15px 40px rgba(37,99,235,0.3);
}

.img-box img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    transition:.3s;
}

.img-box:hover img{
    transform:scale(1.05);
}

/* ===== BUTTON ===== */
.next-btn{
    display:block;
    margin:40px auto;
    padding:12px 35px;
    border:none;
    border-radius:12px;
    font-size:16px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:#fff;
    box-shadow:0 10px 25px rgba(37,99,235,0.4);
    transition:.3s;
}

.next-btn:hover{
    transform:scale(1.05);
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
}

/* FOOTER */
footer{
    text-align:center;
    margin-top:40px;
    color:#64748b;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">
        <i class="bi bi-droplet-half"></i> Microplastic
    </div>

    <a href="/admin">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a class="active" href="#">
        <i class="bi bi-gear"></i> Dataset Processing
    </a>

    <a href="/train_start">
        <i class="bi bi-cpu"></i> Train Model
    </a>

    <a href="/admin_users">
        <i class="bi bi-people"></i> Users
    </a>

    <a href="/logout">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
</div>

<!-- MAIN -->
<div class="main">

<!-- NAVBAR -->
<div class="navbar-custom">
    <div>AI Processing Pipeline</div>

    <div class="nav-icons">
        <a href="#"><i class="bi bi-bell"></i></a>
        <a href="/logout"><i class="bi bi-box-arrow-right"></i></a>
    </div>
</div>

<!-- STEP HEADER -->
<div class="step-card">
    <h4>⚙ {{step_name}}</h4>
</div>

<!-- IMAGE GRID -->
<div class="grid">
    {% for img in images %}
    <div class="img-box">
        <img src="{{ url_for('static', filename=img.split('static/')[1]) }}">
    </div>
    {% endfor %}
</div>

<!-- NEXT BUTTON -->
<a href="{{next_url}}">
    <button class="next-btn">Next Step ➡</button>
</a>

<footer>
© Microplastic Detection Pipeline
</footer>

</div>

</body>
</html>
